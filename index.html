<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timer Portiere 40/20</title><style>body{font-family:-apple-system,sans-serif;background:#111;color:#fff;text-align:center;margin:0}main{max-width:600px;margin:auto;padding:30px 18px}.card{background:#222;border-radius:22px;padding:25px}.clock{font-size:90px;font-weight:900}.ex{font-size:28px;font-weight:800;margin:12px}.sub{color:#aaa}.bar{height:12px;background:#444;border-radius:10px;overflow:hidden;margin:20px 0}.fill{height:100%;background:#fff}.buttons{display:flex;gap:8px}.buttons button{flex:1;padding:15px 4px;border:0;border-radius:14px;font-weight:800;font-size:15px}.start{background:#fff;color:#111}.other{background:#333;color:#fff}.note{color:#aaa;font-size:14px;line-height:1.5;margin-top:20px}</style></head><body><main><div class="card"><b id="phase">PRONTO</b><div id="ex" class="ex">Ponte glutei</div><div id="clock" class="clock">40</div><div id="round" class="sub">Esercizio 1 di 9</div><div class="bar"><div id="fill" class="fill"></div></div></div><div class="buttons"><button id="start" class="start">▶ START</button><button id="pause" class="other">⏸ PAUSA</button><button id="reset" class="other">↺ RESET</button></div><div class="note">🔊 1 beep = STOP · ultimi 3″ del recupero = beep brevi · 2 beep = VIA.<br>Tieni lo schermo acceso durante l'allenamento.</div></main><script>const ex=['Ponte glutei','Affondi indietro','Squat esplosivi','Skater laterali','Plank','Passetti da portiere','Side plank destro','Side plank sinistro','Reazione laterale'];let i=0,w=true,l=40,r=false,t,c;const $=x=>document.getElementById(x);function tone(f,d,delay=0){if(!c)return;setTimeout(()=>{let o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)},delay)}function go(){tone(850,.12);tone(1100,.18,170)}function stop(){tone(400,.35)}function draw(){if(i>=ex.length)return;$('phase').textContent=r?(w?'LAVORO':'RECUPERO'):'PRONTO / PAUSA';$('ex').textContent=w?ex[i]:'Recupera';$('clock').textContent=l;$('round').textContent='Esercizio '+(i+1)+' di '+ex.length;$('fill').style.width=(l/(w?40:20)*100)+'%'}function tick(){if(!r)return;l--;if(!w&&l<=3&&l>0)tone(700,.08);if(l<=0){if(w){w=false;l=20;stop()}else{i++;if(i>=ex.length){r=false;clearInterval(t);$('phase').textContent='COMPLETATO';$('ex').textContent='Allenamento finito 🧤';$('clock').textContent='✓';return}w=true;l=40;go()}}draw()}$('start').onclick=()=>{if(!c){let A=window.AudioContext||window.webkitAudioContext;if(A)c=new A()}if(c&&c.state==='suspended')c.resume();if(r)return;r=true;go();t=setInterval(tick,1000);draw()};$('pause').onclick=()=>{r=false;clearInterval(t);draw()};$('reset').onclick=()=>{r=false;clearInterval(t);i=0;w=true;l=40;draw()};draw();</script></body></html>
